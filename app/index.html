<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1EE; --ink:#15302E; --soft:#5B706D; --line:#C9D8D3;
  --accent:#2F6F6A; --mark:#F2C14E; --field:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10201F; --ink:#E4EFEB; --soft:#9DB3AE; --line:#2A403D;
    --accent:#7CC2B9; --mark:#F2C14E; --field:#172C2A;
  }
}
:root[data-theme="dark"]{
  --bg:#10201F; --ink:#E4EFEB; --soft:#9DB3AE; --line:#2A403D;
  --accent:#7CC2B9; --mark:#F2C14E; --field:#172C2A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;
}
main{width:100%;max-width:34rem;padding:3.75rem 1.5rem 3rem;display:flex;flex-direction:column;min-height:100%}
.tema{position:fixed;top:calc(env(safe-area-inset-top,0px) + .75rem);right:.75rem;z-index:10;width:2.75rem;height:2.75rem;border-radius:50%;border:2px solid var(--line);background:var(--field);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.tema.idioma{right:4rem;font:inherit;font-weight:800;font-size:.9rem;letter-spacing:.02em}
.tema:hover{border-color:var(--accent)}

.progress{display:flex;gap:.4rem;margin-bottom:3rem}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.progress span.done{background:var(--accent)}
.count{color:var(--soft);font-size:1rem;margin:0 0 .5rem}
h1{font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.05;font-weight:800;margin:0 0 2rem;letter-spacing:-.02em}
.big{display:flex;align-items:baseline;gap:.6rem;border-bottom:3px solid var(--ink);padding-bottom:.3rem}
.big input{
  font:inherit;font-size:clamp(3.5rem,16vw,5.5rem);font-weight:600;color:var(--ink);
  background:transparent;border:0;width:100%;min-width:0;padding:0;outline:none;
}
.big input::placeholder{color:var(--line)}
.big input.email{font-size:clamp(1.5rem,6.5vw,2.2rem);font-weight:600;padding:.4rem 0}
.hint{color:var(--soft);font-size:.95rem;line-height:1.5;margin:1rem 0 0}
.saved{color:var(--soft);font-size:.95rem;margin:1rem 0 0}
.big .unit{font-size:1.5rem;color:var(--soft);flex-shrink:0}
.big:focus-within{border-color:var(--accent)}
.choices{display:grid;gap:.75rem}
.choices button{
  font:inherit;font-size:1.5rem;font-weight:600;text-align:left;padding:1.1rem 1.25rem;
  border:2px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);cursor:pointer;
}
.choices button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.error{color:#C2453A;min-height:1.5rem;margin:.75rem 0 0;font-size:1rem}
.actions{display:flex;gap:.75rem;margin-top:auto;padding-top:2.5rem}
.btn{
  font:inherit;font-size:1.15rem;font-weight:600;border-radius:999px;padding:.9rem 1.6rem;cursor:pointer;border:2px solid var(--ink);
}
.btn.primary{background:var(--ink);color:var(--bg);flex:1}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:3px}
.result{font-size:clamp(4.5rem,22vw,7rem);font-weight:800;line-height:1;margin:0;letter-spacing:-.03em}
.result small{font-size:1.2rem;font-weight:400;color:var(--soft);letter-spacing:0;margin-left:.4rem}
.tag{display:inline-block;background:var(--mark);color:#15302E;font-weight:600;padding:.35rem .8rem;border-radius:8px;margin:1rem 0 2rem;font-size:1.1rem}
.scale{position:relative;height:12px;border-radius:6px;margin:0 0 .5rem;
  background:linear-gradient(90deg,#8FB8D8 0 14%,#6FB38A 14% 42%,#E8B64C 42% 70%,#D9745B 70%)}
.scale i{position:absolute;top:-6px;width:4px;height:24px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .6s}
.scale-labels{display:flex;justify-content:space-between;color:var(--soft);font-size:.85rem;margin-bottom:2.5rem}
dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:.8rem 1rem;border-top:1px solid var(--line);padding-top:1.5rem;font-size:1.1rem}
dt{color:var(--soft)} dd{margin:0;font-weight:600;text-align:right}
.note{color:var(--soft);font-size:.95rem;line-height:1.5;margin-top:2rem}
.rutina{margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1.75rem}
.rutina h2{font-size:1.9rem;font-weight:800;margin:0 0 .4rem;letter-spacing:-.01em}
.rutina .estado{color:var(--soft);margin:0 0 1.2rem;line-height:1.5}
.player{background:var(--field);border:2px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:1rem}
.anim{position:relative;aspect-ratio:4/3;background:#F4F8F6}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.anim img.off{visibility:hidden}
.fase{position:absolute;left:.75rem;top:.75rem;background:var(--mark);color:#15302E;font-weight:600;font-size:.85rem;padding:.2rem .6rem;border-radius:6px}
.player-body{padding:1.1rem 1.25rem 1.25rem}
.player h3{font-size:1.6rem;margin:0 0 .6rem;font-weight:800}
.metas{display:flex;gap:1.5rem;margin-bottom:.8rem}
.metas b{display:block;font-size:2rem;line-height:1}
.metas span{color:var(--soft);font-size:.9rem}
.motivo{color:var(--soft);line-height:1.5;margin:.2rem 0 1rem}
.crono{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;margin:0 0 .8rem}
.ctrl{display:flex;gap:.6rem;flex-wrap:wrap}
.ctrl .btn{flex:1;padding:.75rem 1rem}
.num{position:absolute;right:.75rem;top:.75rem;color:var(--soft);font-weight:600;font-size:.9rem;background:rgba(255,255,255,.8);padding:.15rem .5rem;border-radius:6px}
.barra{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.5rem;padding:.75rem;border-top:2px solid var(--line)}
.ctl{font:inherit;font-weight:600;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.6rem .4rem;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-height:3.8rem}
.ctl.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:1.05rem}
.ctl:disabled{opacity:.35;cursor:default}
.progreso{height:5px;background:var(--line)}
.progreso i{display:block;height:100%;width:0;background:var(--accent);transition:width 1s linear}
.cabecera{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.cabecera .crono{margin:0;font-size:2.2rem}
.titulo{display:flex;align-items:center;gap:.5rem;min-width:0}
.titulo h3{margin:0}
.cambiar{flex-shrink:0;width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cambiar:hover{border-color:var(--accent)}
dialog#cambioDlg{border:0;border-radius:20px;padding:1.5rem;width:min(30rem,calc(100% - 1.5rem));max-height:calc(100% - 3rem);background:var(--bg);color:var(--ink)}
dialog#cambioDlg::backdrop{background:rgba(10,25,24,.55)}
dialog#cambioDlg h2{margin:0 0 .4rem;font-size:1.6rem;font-weight:800}
.nuevos{width:100%;margin-top:1rem}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.lista button{width:100%;display:flex;align-items:center;gap:.8rem;font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:14px;padding:.55rem .8rem;cursor:pointer;text-align:left}
.lista button[aria-current="true"]{border-color:var(--accent);background:var(--field)}
.lista img{width:64px;height:48px;object-fit:contain;background:#F4F8F6;border-radius:8px;flex-shrink:0}
.lista .n{font-weight:600}
.lista .d{color:var(--soft);font-size:.9rem}
.step{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step{animation:none}.scale i{transition:none}.progreso i{transition:none}}
</style>
</head>
<body>
<button class="tema idioma" id="lang" type="button"></button>
<button class="tema" id="tema" type="button"></button>
<canvas id="confeti" aria-hidden="true"></canvas>
<main id="app"></main>
<dialog id="cambioDlg"><div id="cambioCuerpo"></div></dialog>

<script src="claude-shim.js"></script>
<script>
/* ---------- Idioma ---------- */
let LANG = "en";
try{ const l = localStorage.getItem("lang"); if(l === "es" || l === "en") LANG = l; }catch(e){}
const T = {
  en: {
    title: "Four questions",
    qEmail: "What's your email?", qAge: "How old are you?", qSex: "What's your sex?", qHeight: "How tall are you?", qWeight: "How much do you weigh?", qGoal: "What's your goal?",
    years: "years", emailHint: "We use it to identify your data and save it with your answers.", emailPh: "name@example.com",
    questionOf: "Question {n} of {t}", back: "Back", next: "Next", seeResult: "See result",
    errEmail: "Enter a valid email, for example name@example.com.", errOption: "Choose an option to continue.", errNumber: "Enter a number to continue.", errRange: "Enter a value between {min} and {max} {unit}.",
    bmiTitle: "Your body mass index", bmi: "BMI", under: "Underweight", normal: "Normal weight", over: "Overweight", obese: "Obesity",
    email: "Email", age: "Age", sex: "Sex", height: "Height", weight: "Weight", goal: "Goal", bmr: "Basal metabolic rate", kcalDay: "kcal/day",
    saving: "Saving your data…", saved: "Data saved.", saveNoDb: "Your data couldn't be saved: open this page from Claude with your account.", saveDenied: "You don't have permission to save data on this page.", saveFail: "Your data couldn't be saved. Try again with “Change answers”.",
    yourExercises: "Your exercises", preparing: "Preparing your exercises…", choosing: "Claude is choosing your exercises…",
    noSample: "Suggestions aren't available here. Open this page from Claude.", noCatalog: "There are no exercises in the database yet.",
    errNotGranted: "To suggest exercises, allow the page to ask Claude.", errRate: "Too many requests in a row. Wait a moment and try again.", errGeneric: "The exercises couldn't be prepared.", retry: "Try again",
    note: "BMI and basal metabolic rate are rough estimates for adults. They don't replace an assessment by a health professional.",
    change: "Change answers", restart: "Start over",
    start: "Start", pause: "Pause", resume: "Resume", repeat: "Repeat", prev: "Previous", nextEx: "Next", done: "Done!",
    stReady: "Press “Start” when you're ready.", stRunning: "Exercise {n} of {t}. Follow the figure's movement.", stPaused: "Session paused.", stDone: "Session complete! Great work.",
    phaseStart: "Start", phaseEnd: "End", phasePaused: "Paused",
    reps: "reps", secs: "time", repsShort: "reps", controls: "Session controls", prevEx: "Previous exercise", nextExAria: "Next exercise",
    altStart: "Start of the movement: {x}", altEnd: "End of the movement: {x}",
    swapAria: "Swap this exercise for another", swapTitle: "Swap exercise", swapHead: "Swap {x}", swapHint: "Choose another exercise. It will keep {r} reps and {s} s.", swapNone: "You're already using every exercise in the catalog.", cancel: "Cancel", chosenByYou: "Chosen by you.",
    more: "Suggest other exercises",
    themeToLight: "Switch to light theme", themeToDark: "Switch to dark theme", themeLight: "Light theme", themeDark: "Dark theme",
    langBtn: "ES", langAria: "Cambiar a español",
  },
  es: {
    title: "Cuatro preguntas",
    qEmail: "¿Cuál es tu email?", qAge: "¿Cuántos años tienes?", qSex: "¿Cuál es tu sexo?", qHeight: "¿Cuánto mides?", qWeight: "¿Cuánto pesas?", qGoal: "¿Cuál es tu objetivo?",
    years: "años", emailHint: "Lo usamos para identificar tus datos y guardarlos junto a tus respuestas.", emailPh: "nombre@ejemplo.com",
    questionOf: "Pregunta {n} de {t}", back: "Atrás", next: "Siguiente", seeResult: "Ver resultado",
    errEmail: "Escribe un email válido, por ejemplo nombre@ejemplo.com.", errOption: "Elige una opción para continuar.", errNumber: "Escribe un número para continuar.", errRange: "Introduce un valor entre {min} y {max} {unit}.",
    bmiTitle: "Tu índice de masa corporal", bmi: "IMC", under: "Bajo peso", normal: "Peso normal", over: "Sobrepeso", obese: "Obesidad",
    email: "Email", age: "Edad", sex: "Sexo", height: "Altura", weight: "Peso", goal: "Objetivo", bmr: "Metabolismo basal", kcalDay: "kcal/día",
    saving: "Guardando tus datos…", saved: "Datos guardados.", saveNoDb: "No se han podido guardar los datos: abre esta página desde Claude con tu cuenta.", saveDenied: "No tienes permiso para guardar datos en esta página.", saveFail: "No se pudieron guardar los datos. Vuelve a intentarlo con «Cambiar datos».",
    yourExercises: "Tus ejercicios", preparing: "Preparando tus ejercicios…", choosing: "Claude está eligiendo tus ejercicios…",
    noSample: "Las sugerencias no están disponibles aquí. Abre esta página desde Claude.", noCatalog: "No hay ejercicios en la base de datos todavía.",
    errNotGranted: "Para sugerir ejercicios hace falta permitir que la página consulte a Claude.", errRate: "Demasiadas consultas seguidas. Espera un momento y vuelve a intentarlo.", errGeneric: "No se pudieron preparar los ejercicios.", retry: "Volver a intentarlo",
    note: "El IMC y el metabolismo basal son estimaciones orientativas para adultos. No sustituyen la valoración de un profesional sanitario.",
    change: "Cambiar datos", restart: "Empezar de nuevo",
    start: "Empezar", pause: "Pausar", resume: "Reanudar", repeat: "Repetir", prev: "Anterior", nextEx: "Siguiente", done: "¡Hecho!",
    stReady: "Pulsa «Empezar» cuando estés listo.", stRunning: "Ejercicio {n} de {t}. Sigue el movimiento de la figura.", stPaused: "Sesión en pausa.", stDone: "¡Sesión completada! Buen trabajo.",
    phaseStart: "Inicio", phaseEnd: "Final", phasePaused: "En pausa",
    reps: "repeticiones", secs: "de tiempo", repsShort: "repeticiones", controls: "Controles de la sesión", prevEx: "Ejercicio anterior", nextExAria: "Ejercicio siguiente",
    altStart: "Inicio del movimiento: {x}", altEnd: "Final del movimiento: {x}",
    swapAria: "Cambiar este ejercicio por otro", swapTitle: "Cambiar ejercicio", swapHead: "Cambiar {x}", swapHint: "Elige otro ejercicio. Mantendrá {r} repeticiones y {s} s.", swapNone: "Ya estás usando todos los ejercicios del catálogo.", cancel: "Cancelar", chosenByYou: "Elegido por ti.",
    more: "Sugerir otros ejercicios",
    themeToLight: "Cambiar a tema claro", themeToDark: "Cambiar a tema oscuro", themeLight: "Tema claro", themeDark: "Tema oscuro",
    langBtn: "EN", langAria: "Switch to English",
  }
};
function t(k, v = {}){ return (T[LANG][k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? ""); }
// Los valores se guardan en español (compatibles con los datos existentes); solo cambia la etiqueta
const OPT = {
  "Hombre": { en: "Male", es: "Hombre" }, "Mujer": { en: "Female", es: "Mujer" },
  "Perder peso": { en: "Lose weight", es: "Perder peso" },
  "Ganar masa muscular": { en: "Gain muscle mass", es: "Ganar masa muscular" },
  "Ganar volumen muscular": { en: "Build muscle size", es: "Ganar volumen muscular" },
};
const GRUPO = { "Piernas":"Legs", "Glúteos":"Glutes", "Pecho":"Chest", "Espalda":"Back", "Hombros":"Shoulders", "Brazos":"Arms", "Core":"Core", "Cardio":"Cardio", "Cuerpo completo":"Full body" };
const opt = v => OPT[v]?.[LANG] ?? v;
const exNombre = e => (LANG === "en" && e.nombre_en) || e.nombre;
const exGrupo = e => LANG === "en" ? (GRUPO[e.grupo] || e.grupo) : e.grupo;
const exMotivo = e => (LANG === "en" ? e.motivo_en : e.motivo_es) || e.motivo || "";
const num = (n, d = 1) => Number(n).toLocaleString(LANG === "es" ? "es-ES" : "en-US", { maximumFractionDigits: d });

/* ---------- Confeti ---------- */
const confetiCanvas = document.getElementById("confeti");
const confetiCtx = confetiCanvas.getContext("2d");
let piezas = [], confetiRAF = null;
const COLORES = ["#F2C14E", "#2F6F6A", "#7CC2B9", "#D9745B", "#8FB8D8", "#6FB38A"];
function confeti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  confetiCanvas.width = w * dpr; confetiCanvas.height = h * dpr;
  confetiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for(let i = 0; i < 140; i++){
    const desdeIzq = i % 2 === 0;
    const ang = (desdeIzq ? -60 : -120) + (Math.random() * 40 - 20);
    const vel = 9 + Math.random() * 8;
    piezas.push({
      x: desdeIzq ? -10 : w + 10, y: h * 0.75,
      vx: Math.cos(ang * Math.PI / 180) * vel, vy: Math.sin(ang * Math.PI / 180) * vel,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
      rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      color: COLORES[Math.floor(Math.random() * COLORES.length)], vida: 0
    });
  }
  if(!confetiRAF) confetiRAF = requestAnimationFrame(pasoConfeti);
}
function pasoConfeti(){
  const w = innerWidth, h = innerHeight;
  confetiCtx.clearRect(0, 0, w, h);
  piezas = piezas.filter(p => p.y < h + 20 && p.vida < 220);
  for(const p of piezas){
    p.vida++; p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    confetiCtx.save();
    confetiCtx.translate(p.x, p.y); confetiCtx.rotate(p.rot);
    confetiCtx.scale(1, Math.cos(p.vida * .15));
    confetiCtx.fillStyle = p.color;
    confetiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    confetiCtx.restore();
  }
  confetiRAF = piezas.length ? requestAnimationFrame(pasoConfeti) : null;
  if(!confetiRAF) confetiCtx.clearRect(0, 0, w, h);
}

/* ---------- Tema claro / oscuro ---------- */
const SOL = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const LUNA = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>';
const temaBtn = document.getElementById("tema");
function temaActual(){
  const t = document.documentElement.dataset.theme;
  if(t) return t;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function pintarTema(){
  const oscuro = temaActual() === "dark";
  temaBtn.innerHTML = oscuro ? SOL : LUNA;
  temaBtn.setAttribute("aria-label", oscuro ? t("themeToLight") : t("themeToDark"));
  temaBtn.title = oscuro ? t("themeLight") : t("themeDark");
}
try{ const guardado = localStorage.getItem("tema"); if(guardado === "light" || guardado === "dark") document.documentElement.dataset.theme = guardado; }catch(e){}
temaBtn.onclick = () => {
  const nuevo = temaActual() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nuevo;
  try{ localStorage.setItem("tema", nuevo); }catch(e){}
  pintarTema();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", pintarTema);
pintarTema();


const langBtn = document.getElementById("lang");
function pintarIdioma(){
  document.documentElement.lang = LANG;
  document.title = t("title");
  langBtn.textContent = t("langBtn");
  langBtn.setAttribute("aria-label", t("langAria"));
  langBtn.title = t("langAria");
  pintarTema();
}
langBtn.onclick = () => {
  LANG = LANG === "en" ? "es" : "en";
  try{ localStorage.setItem("lang", LANG); }catch(e){}
  pintarIdioma();
  if(current < questions.length) renderQuestion();
  else renderResult(false);
  if(document.getElementById("cambioDlg").open) abrirCambio();
};

const questions = [
  { key:"email",  title:"qEmail", email:true },
  { key:"edad",   title:"qAge", unit:"years", min:2,  max:120, step:1 },
  { key:"sexo",   title:"qSex", options:["Hombre","Mujer"] },
  { key:"altura", title:"qHeight", unit:"cm", min:50, max:250, step:1 },
  { key:"peso",   title:"qWeight", unit:"kg", min:10, max:350, step:0.1 },
  { key:"objetivo", title:"qGoal", options:["Perder peso","Ganar masa muscular","Ganar volumen muscular"] }
];
const unitLabel = u => u === "years" ? t("years") : u;
const answers = {};
let current = 0;
const app = document.getElementById("app");

function progress(){
  return '<div class="progress" aria-hidden="true">' +
    questions.map((_,i)=>`<span class="${i<current || current>=questions.length ? "done":""}"></span>`).join("") +
  '</div>';
}

function renderQuestion(){
  const q = questions[current];
  const title = t(q.title);
  const value = answers[q.key] ?? "";
  let field;
  if(q.options){
    field = '<div class="choices" role="group" aria-label="'+title+'">' +
      q.options.map(o=>`<button type="button" data-opt="${o}" aria-pressed="${value===o}">${opt(o)}</button>`).join("") +
    '</div>';
  } else if(q.email){
    field = `<label class="big"><input id="num" class="email" type="email" inputmode="email" autocomplete="email"
      placeholder="${t("emailPh")}" maxlength="120" value="${String(value).replace(/"/g,"&quot;")}" aria-label="${title}"></label>
      <p class="hint">${t("emailHint")}</p>`;
  } else {
    field = `<label class="big"><input id="num" type="number" inputmode="decimal" placeholder="0"
      min="${q.min}" max="${q.max}" step="${q.step}" value="${value}" aria-label="${title}">
      <span class="unit">${unitLabel(q.unit)}</span></label>`;
  }
  app.innerHTML = progress() + `
    <form class="step" id="form" novalidate style="display:flex;flex-direction:column;flex:1">
      <p class="count">${t("questionOf", { n: current+1, t: questions.length })}</p>
      <h1>${title}</h1>
      ${field}
      <p class="error" id="err" role="alert"></p>
      <div class="actions">
        ${current>0 ? `<button type="button" class="btn ghost" id="back">${t("back")}</button>` : ""}
        <button type="submit" class="btn primary">${current===questions.length-1 ? t("seeResult") : t("next")}</button>
      </div>
    </form>`;

  const form = document.getElementById("form");
  const input = document.getElementById("num");
  if(input) input.focus();

  app.querySelectorAll("[data-opt]").forEach(b=>{
    b.onclick = ()=>{ answers[q.key]=b.dataset.opt; next(); };
  });
  const back = document.getElementById("back");
  if(back) back.onclick = ()=>{ current--; renderQuestion(); };

  form.onsubmit = e=>{
    e.preventDefault();
    const err = document.getElementById("err");
    if(q.email){
      const v = input.value.trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ err.textContent=t("errEmail"); return; }
      answers.email = v;
    } else if(q.options){
      if(!answers[q.key]){ err.textContent=t("errOption"); return; }
    } else {
      const v = parseFloat(String(input.value).replace(",","."));
      if(isNaN(v)){ err.textContent=t("errNumber"); return; }
      if(v<q.min || v>q.max){ err.textContent=t("errRange", { min: q.min, max: q.max, unit: unitLabel(q.unit) }); return; }
      answers[q.key]=v;
    }
    next();
  };
}

function next(){
  current++;
  current < questions.length ? renderQuestion() : renderResult(true);
}

// Estados de texto que hay que poder volver a pintar al cambiar de idioma
let saveState = "saving", rutinaState = { key: "preparing" };

function renderResult(nuevo = true){
  const { edad, sexo, altura, peso } = answers;
  const m = altura/100;
  const imc = peso/(m*m);
  let catKey;
  if(imc<18.5) catKey="under";
  else if(imc<25) catKey="normal";
  else if(imc<30) catKey="over";
  else catKey="obese";
  // Mifflin-St Jeor
  const tmb = 10*peso + 6.25*altura - 5*edad + (sexo==="Hombre" ? 5 : -161);
  const pos = Math.min(Math.max((imc-15)/(40-15),0),1)*100;

  app.innerHTML = progress() + `
    <section class="step" style="display:flex;flex-direction:column;flex:1">
      <p class="count">${t("bmiTitle")}</p>
      <p class="result">${num(imc.toFixed(1))}<small>${t("bmi")}</small></p>
      <span class="tag">${t(catKey)}</span>
      <div class="scale" aria-hidden="true"><i style="left:${pos}%"></i></div>
      <div class="scale-labels" aria-hidden="true"><span>15</span><span>${num(18.5)}</span><span>25</span><span>30</span><span>40</span></div>
      <dl>
        <dt>${t("email")}</dt><dd style="word-break:break-all">${answers.email.replace(/</g,"&lt;")}</dd>
        <dt>${t("age")}</dt><dd>${edad} ${t("years")}</dd>
        <dt>${t("sex")}</dt><dd>${opt(sexo)}</dd>
        <dt>${t("height")}</dt><dd>${altura} cm</dd>
        <dt>${t("weight")}</dt><dd>${num(peso)} kg</dd>
        <dt>${t("goal")}</dt><dd>${opt(answers.objetivo)}</dd>
        <dt>${t("bmr")}</dt><dd>${num(Math.round(tmb), 0)} ${t("kcalDay")}</dd>
      </dl>
      <p class="saved" id="saved" role="status"></p>
      <section class="rutina" aria-live="polite">
        <h2>${t("yourExercises")}</h2>
        <div id="rutina"></div>
      </section>
      <p class="note">${t("note")}</p>
      <div class="actions">
        <button class="btn ghost" id="edit">${t("change")}</button>
        <button class="btn primary" id="restart">${t("restart")}</button>
      </div>
    </section>`;
  document.getElementById("edit").onclick = ()=>{ peticion?.abort(); pararTodo(); current=0; renderQuestion(); };
  document.getElementById("restart").onclick = ()=>{ peticion?.abort(); pararTodo(); for(const k in answers) delete answers[k]; current=0; renderQuestion(); };

  if(nuevo){
    const datos = { email: answers.email, edad, sexo, altura, peso, objetivo: answers.objetivo,
      imc: Math.round(imc*10)/10, metabolismoBasal: Math.round(tmb) };
    saveState = "saving";
    guardar(datos);
    sugerir(datos, catKey);
  }
  pintarGuardado();
  if(!nuevo){
    if(rutina.length && rutinaState.key === "ok") pintarRutina(sesion, true);
    else pintarEstadoRutina();
  }
}

function pintarGuardado(){ const el = document.getElementById("saved"); if(el) el.textContent = t(saveState); }

let dbRef = null;
let dbGlobal = null;
async function conectar(){
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  dbGlobal = db;
  const uid = user ? await user.id() : null;
  if(!db || !uid) return null;
  dbRef = db.doc("personas/" + uid);
  return dbRef;
}
const listo = conectar().catch(()=>null);

async function guardar(datos){
  const ref = await listo;
  if(!ref){ saveState = "saveNoDb"; pintarGuardado(); return; }
  try{
    await ref.set({ ...datos, idioma: LANG, actualizado: Date.now() });
    saveState = "saved";
  }catch(e){
    saveState = e?.code === "invalid_argument" ? "saveDenied" : "saveFail";
  }
  pintarGuardado();
}

/* ---------- Rutina sugerida por Claude ---------- */
const escHTML = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const blob = id => "/_blob/" + id;
let rutina = [], actual = 0, animTimer = null, cronoTimer = null, restante = 0, corriendo = false, peticion = null;

async function cargarCatalogo(){
  await listo;
  if(!dbGlobal) return [];
  const snap = await dbGlobal.collection("ejercicios").get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function pintarEstadoRutina(){
  const el = document.getElementById("rutina"); if(!el) return;
  el.innerHTML = `<p class="estado">${t(rutinaState.key)}</p>` + (rutinaState.retry ? `<button class="btn ghost" id="reintentar">${t("retry")}</button>` : "");
  if(rutinaState.retry) document.getElementById("reintentar").onclick = rutinaState.retry;
}
function estadoRutina(key, retry){ rutinaState = { key, retry }; pintarEstadoRutina(); }

let ultimaPeticion = null, catalogoGlobal = [];
async function sugerir(datos, catKey, anteriores = []){
  ultimaPeticion = { datos, catKey };
  pararTodo();
  peticion?.abort();
  const ctl = peticion = new AbortController();
  estadoRutina("choosing");
  const sample = await claude.use("sample");
  if(ctl.signal.aborted) return;
  if(!sample){ estadoRutina("noSample"); return; }
  let catalogo;
  try{ catalogo = await cargarCatalogo(); }catch(e){ catalogo = []; }
  catalogoGlobal = catalogo;
  if(!catalogo.length){ estadoRutina("noCatalog"); return; }

  const lista = catalogo.map(e => ({ id: e.id, name: e.nombre_en || e.nombre, group: GRUPO[e.grupo] || e.grupo, description: e.descripcion_en || e.descripcion }));
  const goal = OPT[datos.objetivo]?.en || datos.objetivo;
  const sex = OPT[datos.sexo]?.en || datos.sexo;
  const bmiCat = T.en[catKey];
  const prompt = `You are a personal trainer. Choose between 3 and 5 exercises ONLY from this catalog for an at-home session tailored to this person.

Person: ${datos.edad} years old, ${sex}, ${datos.altura} cm, ${datos.peso} kg, BMI ${datos.imc} (${bmiCat}). Goal: ${goal}.

Catalog (JSON):
${JSON.stringify(lista)}

Adjust intensity to age and BMI: fewer reps and shorter times for older people or those with a high BMI, and avoid jumping or high-impact exercises if BMI is 30 or more or age is over 65. Adjust the session to the goal: for "Lose weight", favor dynamic and cardio exercises with more time and a continuous pace; for "Gain muscle mass", strength exercises working several muscle groups with moderate reps and good technique; for "Build muscle size", more demanding strength exercises with high reps close to failure and longer time under tension. Mention the goal in the reason when it makes sense. Order them as a session (easiest to hardest).${anteriores.length ? `

The person is asking for a new session. The previous one had these ids: ${JSON.stringify(anteriores)}. Propose a different combination, changing at least half of the exercises if the catalog allows it.` : ""}

Reply only with JSON in this shape:
{"ejercicios":[{"id":"sentadilla","repeticiones":12,"tiempoSegundos":45,"motivo_en":"One short sentence in English explaining why.","motivo_es":"La misma frase en español."}]}
"id" must be exactly one of the catalog ids. "repeticiones" between 5 and 30. "tiempoSegundos" between 20 and 90.`;

  try{
    const r = await sample.json(prompt, Object.assign({ signal: ctl.signal, modelTier: "quick" }, anteriores.length ? { cache: false } : {}));
    const porId = Object.fromEntries(catalogo.map(e => [e.id, e]));
    const vistos = new Set();
    rutina = (Array.isArray(r?.ejercicios) ? r.ejercicios : [])
      .filter(x => porId[x?.id] && !vistos.has(x.id) && vistos.add(x.id))
      .slice(0, 5)
      .map(x => ({ ...porId[x.id],
        repeticiones: Math.min(Math.max(Math.round(+x.repeticiones || 10), 1), 50),
        tiempo: Math.min(Math.max(Math.round(+x.tiempoSegundos || 30), 10), 180),
        motivo_en: String(x.motivo_en || "").slice(0, 200),
        motivo_es: String(x.motivo_es || "").slice(0, 200) }));
    if(!rutina.length) throw { code: "vacio" };
    actual = 0;
    rutinaState = { key: "ok" };
    pintarRutina();
    guardarRutina();
  }catch(e){
    if(e?.code === "cancelled") return;
    const key = { not_granted: "errNotGranted", rate_limited: "errRate" }[e?.code] || "errGeneric";
    estadoRutina(key, () => sugerir(datos, catKey, anteriores));
  }
}

function guardarRutina(){
  listo.then(ref => ref && ref.update({ rutina: rutina.map(x => ({ id: x.id, repeticiones: x.repeticiones, tiempoSegundos: x.tiempo })), rutinaFecha: Date.now() }).catch(()=>{}));
}

function fmt(s){ return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

// estado de la sesión: "lista" (sin empezar), "corriendo", "pausada", "terminada"
let sesion = "lista";

function pararTodo(){
  clearInterval(animTimer); clearInterval(cronoTimer);
  animTimer = cronoTimer = null; corriendo = false; sesion = "lista";
}

const ICON = {
  prev: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 5v14M19 5 9 12l10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  next: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M18 5v14M5 5l10 7-10 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2" fill="currentColor"/></svg>',
};

function irA(i){
  if(i < 0 || i >= rutina.length) return;
  const seguia = sesion;
  actual = i;
  pintarRutina(seguia === "corriendo" ? "corriendo" : (seguia === "pausada" ? "pausada" : "lista"));
}

// mantenerTiempo: al cambiar de idioma se vuelve a pintar sin reiniciar la cuenta atrás
function pintarRutina(modo = "lista", mantenerTiempo = false){
  clearInterval(animTimer); clearInterval(cronoTimer);
  animTimer = cronoTimer = null;
  const e = rutina[actual];
  if(!mantenerTiempo || modo === "lista") restante = e.tiempo;
  const inicio = e.imagenInicio || e.imagen, fin = e.imagenFin || e.imagen;
  const nombre = escHTML(exNombre(e));
  const motivo = exMotivo(e);
  document.getElementById("rutina").innerHTML = `
    <p class="estado" id="estadoSesion"></p>
    <div class="player">
      <div class="anim">
        ${inicio ? `<img id="imgA" src="${blob(escHTML(inicio))}" alt="${t("altStart", { x: nombre })}">` : ""}
        ${fin ? `<img id="imgB" class="off" src="${blob(escHTML(fin))}" alt="${t("altEnd", { x: nombre })}">` : ""}
        <span class="fase" id="fase">${t("phaseStart")}</span>
        <span class="num">${actual+1} / ${rutina.length}</span>
      </div>
      <div class="barra" role="group" aria-label="${t("controls")}">
        <button class="ctl" id="prev" ${actual===0 ? "disabled" : ""} aria-label="${t("prevEx")}">${ICON.prev}<span>${t("prev")}</span></button>
        <button class="ctl main" id="play"></button>
        <button class="ctl" id="sig" ${actual===rutina.length-1 ? "disabled" : ""} aria-label="${t("nextExAria")}">${ICON.next}<span>${t("nextEx")}</span></button>
      </div>
      <div class="progreso" aria-hidden="true"><i id="progreso"></i></div>
      <div class="player-body">
        <div class="cabecera">
          <div class="titulo">
            <h3>${nombre}</h3>
            <button class="cambiar" id="cambiar" type="button" aria-label="${t("swapAria")}" title="${t("swapTitle")}">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg>
            </button>
          </div>
          <p class="crono" id="crono" aria-live="off">${fmt(restante)}</p>
        </div>
        <div class="metas">
          <div><b>${e.repeticiones}</b><span>${t("reps")}</span></div>
          <div><b>${e.tiempo} s</b><span>${t("secs")}</span></div>
        </div>
        ${motivo ? `<p class="motivo">${escHTML(motivo)}</p>` : ""}
      </div>
    </div>
    <ol class="lista">
      ${rutina.map((x,i) => `<li><button data-i="${i}" aria-current="${i===actual}">
        <img src="${blob(escHTML(x.imagenInicio || x.imagen))}" alt="">
        <span><span class="n">${escHTML(exNombre(x))}</span><br><span class="d">${x.repeticiones} ${t("repsShort")} · ${x.tiempo} s</span></span>
      </button></li>`).join("")}
    </ol>
    <button class="btn ghost nuevos" id="nuevos" type="button">${t("more")}</button>`;

  const a = document.getElementById("imgA"), b = document.getElementById("imgB"), fase = document.getElementById("fase");
  const play = document.getElementById("play"), crono = document.getElementById("crono");
  const barraProg = document.getElementById("progreso"), estadoEl = document.getElementById("estadoSesion");
  let enFin = false;

  function animar(on){
    clearInterval(animTimer); animTimer = null;
    if(!on || !a || !b) return;
    animTimer = setInterval(() => {
      enFin = !enFin;
      a.classList.toggle("off", enFin); b.classList.toggle("off", !enFin);
      fase.textContent = enFin ? t("phaseEnd") : t("phaseStart");
    }, 800);
  }

  function pintarEstado(){
    const textos = {
      lista: [t("stReady"), ICON.play, t("start")],
      corriendo: [t("stRunning", { n: actual+1, t: rutina.length }), ICON.pause, t("pause")],
      pausada: [t("stPaused"), ICON.play, t("resume")],
      terminada: [t("stDone"), ICON.play, t("repeat")],
    }[sesion];
    estadoEl.textContent = textos[0];
    play.innerHTML = textos[1] + `<span>${textos[2]}</span>`;
    play.setAttribute("aria-label", textos[2]);
    crono.textContent = sesion === "terminada" ? t("done") : fmt(Math.max(restante,0));
    barraProg.style.width = ((e.tiempo - Math.max(restante,0)) / e.tiempo * 100) + "%";
    fase.textContent = sesion === "pausada" ? t("phasePaused") : (enFin ? t("phaseEnd") : t("phaseStart"));
  }

  function arrancar(){
    sesion = "corriendo"; corriendo = true;
    animar(true);
    clearInterval(cronoTimer);
    cronoTimer = setInterval(() => {
      restante--;
      if(restante <= 0){
        clearInterval(cronoTimer); cronoTimer = null;
        confeti();
        if(actual < rutina.length - 1){ actual++; pintarRutina("corriendo"); return; }
        sesion = "terminada"; corriendo = false; animar(false);
      }
      pintarEstado();
    }, 1000);
    pintarEstado();
  }

  function pausar(){
    sesion = "pausada"; corriendo = false;
    clearInterval(cronoTimer); cronoTimer = null;
    animar(false);
    pintarEstado();
  }

  play.onclick = () => {
    if(sesion === "corriendo") return pausar();
    if(sesion === "terminada"){ actual = 0; return pintarRutina("corriendo"); }
    arrancar();
  };
  document.getElementById("nuevos").onclick = () => {
    if(!ultimaPeticion) return;
    sugerir(ultimaPeticion.datos, ultimaPeticion.catKey, rutina.map(x => x.id));
  };
  document.getElementById("cambiar").onclick = () => abrirCambio();
  document.getElementById("prev").onclick = () => irA(actual - 1);
  document.getElementById("sig").onclick = () => { confeti(); irA(actual + 1); };
  document.querySelectorAll(".lista [data-i]").forEach(btn => btn.onclick = () => irA(+btn.dataset.i));

  sesion = modo;
  if(modo === "corriendo") arrancar();
  else { animar(modo === "lista"); pintarEstado(); }
}

function abrirCambio(){
  const dlg = document.getElementById("cambioDlg");
  const enRutina = new Set(rutina.map(x => x.id));
  const disponibles = catalogoGlobal.filter(x => !enRutina.has(x.id))
    .sort((a,b) => exNombre(a).localeCompare(exNombre(b), LANG));
  const e = rutina[actual];
  if(!e) return;
  dlg.setAttribute("aria-label", t("swapTitle"));
  document.getElementById("cambioCuerpo").innerHTML = `
    <h2>${t("swapHead", { x: escHTML(exNombre(e)) })}</h2>
    <p class="estado">${t("swapHint", { r: e.repeticiones, s: e.tiempo })}</p>
    ${disponibles.length ? `<ol class="lista">${disponibles.map(x => `<li><button data-id="${escHTML(x.id)}">
      <img src="${blob(escHTML(x.imagenInicio || x.imagen))}" alt="">
      <span><span class="n">${escHTML(exNombre(x))}</span><br><span class="d">${escHTML(exGrupo(x))}</span></span>
    </button></li>`).join("")}</ol>` : `<p class="estado">${t("swapNone")}</p>`}
    <div class="actions" style="padding-top:1.25rem"><button class="btn ghost" id="cambioCancelar" type="button" style="flex:1">${t("cancel")}</button></div>`;
  document.getElementById("cambioCancelar").onclick = () => dlg.close();
  dlg.querySelectorAll("[data-id]").forEach(b => b.onclick = () => {
    const nuevo = catalogoGlobal.find(x => x.id === b.dataset.id);
    if(!nuevo) return;
    rutina[actual] = { ...nuevo, repeticiones: e.repeticiones, tiempo: e.tiempo, motivo_en: T.en.chosenByYou, motivo_es: T.es.chosenByYou };
    dlg.close();
    irA(actual);
    guardarRutina();
  });
  if(!dlg.open) dlg.showModal();
}

// Si la persona ya respondió antes, rellena sus respuestas
listo.then(async ref => {
  if(!ref) return;
  try{
    const snap = await ref.get();
    if(!snap.exists) return;
    const d = snap.data();
    ["email","edad","sexo","altura","peso","objetivo"].forEach(k => { if(d[k] != null && answers[k] == null) answers[k] = d[k]; });
    if(current < questions.length) renderQuestion();
  }catch(e){}
});

pintarIdioma();
renderQuestion();
</script>
